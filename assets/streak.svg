<svg xmlns="http://www.w3.org/2000/svg" width="960" height="187" viewBox="0 0 960 187" role="img"><title>Consistency over time</title><rect width="960" height="187" rx="18" fill="#0d1117"/><rect x="1" y="1" width="958" height="185" rx="18" fill="none" stroke="#263344"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="30" y="38" font-size="21" fill="#e6edf3">Consistency over time</text><text x="30" y="63" font-size="12" fill="#94a3b8">Streaks within the displayed contribution window; today may still be in progress.</text><text x="30" y="111" font-size="11" fill="#94a3b8">CURRENT STREAK</text><text x="30" y="155" font-size="30" fill="#a5b4fc">0 days</text><text x="340" y="111" font-size="11" fill="#94a3b8">LONGEST IN WINDOW</text><text x="340" y="155" font-size="30" fill="#a5b4fc">5 days</text><text x="650" y="111" font-size="11" fill="#94a3b8">ACTIVE DAYS</text><text x="650" y="155" font-size="30" fill="#a5b4fc">16 days</text></g></svg>